# Entorno de desarrollo: Django (API + admin) y Vite (web) con recarga en caliente.
#   docker compose up --build
# Web:   http://localhost:5180
# Admin: http://localhost:8010/admin/
# Los puertos se pueden cambiar con FRONTEND_PORT y BACKEND_PORT (p. ej. en un archivo .env).

services:
  backend:
    build: ./backend
    # Mismo usuario que en el host para que db.sqlite3 no acabe siendo de root
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8010}:8000"

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      # Las dependencias se quedan en el contenedor, no se mezclan con las del host
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    depends_on:
      - backend
